name: Test (and deploy on request)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit, build, end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser test tools
        run: |
          pip install pytest==9.1.1 playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: End-to-end tests against the build
        run: |
          node scripts/serve.mjs 4173 &
          sleep 1
          python -m pytest tests/e2e -q

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    # Deploys only when started by hand (Actions → this workflow → Run workflow). Pushes just run the tests.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: End-to-end tests against the live site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test tools
        run: |
          pip install pytest==9.1.1 playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Wait for the new version to be served
        run: |
          for i in $(seq 1 30); do
            curl -fsS "${{ needs.deploy.outputs.url }}" -o /dev/null && break
            sleep 5
          done
      - name: Run end-to-end tests on the live URL
        env:
          KAMRA_URL: ${{ needs.deploy.outputs.url }}
        run: python -m pytest tests/e2e -q
