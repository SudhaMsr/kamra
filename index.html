<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--CSP-->
  <title>Kamra — Find a flatmate, not just a flat</title>
  <meta name="description" content="Kamra helps you find rooms and flatmates across Indian cities, matched on what matters at home: food, guests, work hours and budget. Free to contact, phone numbers stay private.">
  <meta name="theme-color" content="#2a31a0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0f22" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="Kamra — Find a flatmate, not just a flat">
  <meta property="og:description" content="Rooms and flatmates near your office, matched on lifestyle. Free to contact.">
  <meta property="og:type" content="website">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <script>
    // Apply the saved theme before first paint so there's no flash.
    (function () {
      var t = "system";
      try { var s = JSON.parse(localStorage.getItem("kamra:v2") || localStorage.getItem("kamra:v1") || "{}"); if (s.theme === "light" || s.theme === "dark") t = s.theme; } catch (e) {}
      if (t === "system") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <!--CSS-->
</head>
<body>
  <div id="root"></div>
  <noscript><p style="padding:24px;font-family:system-ui">Kamra needs JavaScript to search rooms. Please enable it and reload.</p></noscript>
  <!--JS-->
</body>
</html>
